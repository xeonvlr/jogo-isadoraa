<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PARA MINHA NAMORADA ISADORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-purple: #9d50bb;
            --p-blue: #6e7ff3;
            --p-cyan: #00f2fe;
            --p-pink: #ff007f;
            --p-dark: #0a081a;
            --p-border: #ffffff;
            --p-yellow: #ffeb3b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: var(--p-dark);
            
            /* --- NOVO FUNDO APERFEIÇOADO --- */
            /* 1. Base: Gradiente Céu (Roxo para Azul Profundo) */
            background-image: 
                radial-gradient(circle at 50% 50%, #2e1a47 0%, #1a1a3a 40%, #050510 100%),
                /* 2. Camada de Pontinhos de Luz (Estrelas Brancas CSS) */
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px),
                /* 3. Sua Estrela (`estrela.jpeg`) integrada */
                url('estrela.jpeg');
            
            /* Configurações das camadas de fundo */
            background-repeat: no-repeat, repeat, repeat, repeat, repeat;
            background-position: center, 20px 50px, 130px 270px, 70px 100px, center;
            /* Tamanhos: Gradiente, Estrelas CSS Pequenas, Médias, Grandes, Sua Estrela */
            background-size: cover, 200px 200px, 150px 150px, 300px 300px, 80px 80px; 
            background-blend-mode: normal, screen, screen, screen, overlay; /* Mistura perfeita */
            
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white;
        }

        #jogo-container {
            background: rgba(15, 10, 30, 0.96);
            border: 4px solid #ffffff;
            padding: 30px 20px; width: 92%; max-width: 360px;
            min-height: 450px;
            display: flex; flex-direction: column; justify-content: center;
            text-align: center; position: relative;
            box-shadow: 0 0 40px rgba(157, 80, 187, 0.4); z-index: 10;
        }

        .secao-conteudo {
            display: flex; flex-direction: column;
            gap: 20px;
            height: 100%; justify-content: center;
        }

        /* --- SISTEMA DE CONQUISTAS --- */
        #conquista-wrapper {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 94vw; max-width: 340px; display: flex; flex-direction: column;
            gap: 10px; z-index: 9999; pointer-events: none;
        }

        .notificacao-conquista {
            background: rgba(20, 15, 40, 0.98); border: 3px solid #fff; outline: 3px solid #000;
            padding: 8px; display: flex; align-items: center; opacity: 0;
            transform: translateY(-50px); transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            align-self: center;
        }

        .notificacao-conquista.visible { opacity: 1; transform: translateY(0); }
        
        .icone-estrela { 
            width: 24px; height: 24px; 
            image-rendering: pixelated; 
            animation: pulse-purple 2s ease-in-out infinite;
        }

        .borda-retro-roxa {
            border: 4px double var(--p-purple);
            box-shadow: 0 0 10px rgba(157, 80, 187, 0.5);
        }

        .borda-retro-branca {
            border: 4px double #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        h1 { font-size: 10px; line-height: 1.6; margin: 0; text-shadow: 2px 2px var(--p-blue); }
        p { margin: 0; line-height: 1.6; }

        .foto-pixel {
            width: 170px; height: auto; 
            padding: 5px; image-rendering: pixelated; align-self: center;
            animation: pulse-white 2s ease-in-out infinite;
        }

        @keyframes pulse-purple {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--p-purple)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 15px var(--p-purple)); }
        }

        @keyframes pulse-white {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #ffffff); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 15px #ffffff); }
        }

        .btn-container { display: flex; flex-direction: column; gap: 12px; }
        button {
            padding: 16px 10px; font-family: 'Press Start 2P', cursive; font-size: 8px;
            border: 4px solid #000; cursor: pointer; background: var(--p-blue); color: white;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4); position: relative;
        }

        .btn-voltar { width: 100%; margin-top: 10px; }
        .purple-btn { background: var(--p-purple); }
        .pink-btn { background: var(--p-pink); }
        .hidden { display: none !important; }

        .floating { position: absolute; pointer-events: none; z-index: 1; animation: floatUp 3s linear forwards; font-size: 24px; }
        @keyframes floatUp { 0% { transform: translateY(110vh); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-20vh); opacity: 0; } }

        #contador {
            font-size: 9px; background: rgba(0, 0, 0, 0.85); padding: 15px 10px;
            line-height: 2.2;
        }

        @keyframes explosaoVitoria {
            0% { transform: translate(0, 0) scale(0.1); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; }
        }
        .particula-vitoria { position: fixed; bottom: 0; left: 50%; z-index: 9998; pointer-events: none; animation: explosaoVitoria 3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    </style>
</head>
<body onclick="iniciarAudioAoClicar()">

    <audio id="meuAudio" loop><source src="musica.mp3" type="audio/mpeg"></audio>
    <div id="conquista-wrapper"></div>

    <div id="jogo-container">
        
        <div id="tela-inicial" class="secao-conteudo">
            <img src="foto.png" alt="NOSSA FOTO" class="foto-pixel borda-retro-branca">
            <h1>VOCE ME AMA?</h1>
            <div class="btn-container">
                <button class="purple-btn" onclick="mostrarSecao('sim')">SIM [ 💜 ]</button>
                <button onclick="mostrarSecao('concerteza')">CONCERTEZA [ 💙 ]</button>
                <button class="pink-btn" onclick="mostrarSecao('obvio')">OBVIO ISA [ ✨ ]</button>
                <button style="background: #ffaa00;" onclick="mostrarSecao('sorriso')">SORRISO [ 😁 ]</button>
            </div>
        </div>

        <div id="resposta-sim" class="hidden secao-conteudo">
            <h1>EU TAMBEM TE AMO ISADORA!</h1>
            <p style="color: var(--p-blue); font-size: 9px;">AMOR DA MINHA VIDA!</p>
            <button class="btn-voltar" onclick="voltarMenu()">[ VOLTAR ]</button>
        </div>

        <div id="resposta-concerteza" class="hidden secao-conteudo">
            <h1>CONECTADAS DESDE <br><span style="color: var(--p-blue); text-shadow: 2px 2px var(--p-purple);">05/07/2025</span></h1>
            <div id="contador" class="borda-retro-branca">CALCULANDO...</div>
            <p style="color: var(--p-blue); font-size: 8px;">PRA SEMPRE E SEMPRE AMOR!</p>
            <button class="btn-voltar" onclick="voltarMenu()">[ VOLTAR ]</button>
        </div>

        <div id="resposta-obvio" class="hidden secao-conteudo">
            <h1>PROVE SEU AMOR!</h1>
            <div id="wrapper-fugitivo" style="height: 120px; position: relative;">
                <button id="btn-fugitivo" style="min-width:160px;">ME DA UM BEIJO! 💋</button>
            </div>
            <div id="final-obvio" class="hidden">
                <span style="font-size: 40px; display: block; margin-bottom: 10px;">🙄</span>
                <p style="color: var(--p-blue); font-size: 11px;">VOCE ME PEGOU !!!</p>
            </div>
            <button class="btn-voltar" onclick="voltarMenu()">[ VOLTAR ]</button>
        </div>

        <div id="resposta-sorriso" class="hidden secao-conteudo">
            <h1>SEU SORRISO ILUMINA TUDO!</h1>
            <img src="sorriso.jpeg" alt="SORRISO" class="foto-pixel borda-retro-branca">
            <p style="color: #fff; font-size: 8px;">SEU SORRISO E PERFEITO, <br> SOU APAIXONADA!</p>
            <button class="btn-voltar" onclick="voltarMenu()">[ VOLTAR ]</button>
        </div>

    </div>

    <template id="template-conquista">
        <div class="notificacao-conquista">
            <div style="margin-right: 10px; padding: 4px;">
                <img src="estrela.png" class="icone-estrela">
            </div>
            <div>
                <div style="font-size: 6px; color: var(--p-yellow);">Achievement Unlocked</div>
                <div class="ach-title" style="font-size: 7px;"></div>
            </div>
        </div>
    </template>

    <script>
        const dataInicio = new Date(2025, 6, 5); 
        const audio = document.getElementById('meuAudio');
        let intervaloContador, cliquesFugitivo = 0;

        function dispararConquista(texto) {
            const wrapper = document.getElementById('conquista-wrapper');
            const template = document.getElementById('template-conquista').content;
            const clone = template.cloneNode(true).firstElementChild;
            clone.querySelector('.ach-title').innerText = texto;
            wrapper.appendChild(clone);
            setTimeout(() => clone.classList.add('visible'), 100);
            setTimeout(() => {
                clone.classList.remove('visible');
                setTimeout(() => clone.remove(), 600);
            }, 5000);
        }

        function iniciarExplosaoVitoria() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'particula-vitoria';
                    const tipo = Math.random();
                    if (tipo > 0.6) el.innerHTML = `<img src="estrela.png" style="width:24px;">`;
                    else el.innerText = tipo > 0.3 ? '💜' : '💙';
                    const angleDeg = (Math.random() * 100 - 50);
                    const velocity = Math.random() * 250 + 200;
                    el.style.setProperty('--dx', `${Math.sin(angleDeg * Math.PI/180) * velocity}px`);
                    el.style.setProperty('--dy', `-${velocity + 400}px`);
                    el.style.setProperty('--rot', `${Math.random() * 360}deg`);
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 3000);
                }, i * 25);
            }
        }

        function mostrarSecao(tipo) {
            document.querySelectorAll('#jogo-container > div').forEach(div => div.classList.add('hidden'));
            const secao = document.getElementById('resposta-' + tipo);
            secao.classList.remove('hidden');
            if(tipo === 'concerteza') {
                atualizarContador();
                intervaloContador = setInterval(atualizarContador, 1000);
            }
            if(tipo === 'obvio') resetarBotaoFugitivo();
        }

        function voltarMenu() {
            document.querySelectorAll('#jogo-container > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('tela-inicial').classList.remove('hidden');
            clearInterval(intervaloContador);
        }

        function atualizarContador() {
            const diff = new Date() - dataInicio;
            const d = Math.floor(diff / 86400000), h = Math.floor((diff / 3600000) % 24), m = Math.floor((diff / 60000) % 60), s = Math.floor((diff / 1000) % 60);
            document.getElementById('contador').innerHTML = `DIAS: ${d}<br>HORAS: ${h}<br>MINS: ${m}<br>SECS: ${s}`;
        }

        const btnF = document.getElementById('btn-fugitivo');
        function resetarBotaoFugitivo() {
            cliquesFugitivo = 0;
            btnF.style.display = 'block'; btnF.style.position = 'relative';
            btnF.style.left = '0'; btnF.style.top = '0';
            btnF.innerText = "ME DA UM BEIJO! 💋";
            document.getElementById('final-obvio').classList.add('hidden');
            document.getElementById('wrapper-fugitivo').style.display = 'block';
        }

        function fugir() {
            cliquesFugitivo++;
            const wrap = document.getElementById('wrapper-fugitivo');
            if(cliquesFugitivo < 6) {
                btnF.style.position = 'absolute';
                btnF.style.left = Math.random() * (wrap.clientWidth - btnF.clientWidth) + 'px';
                btnF.style.top = Math.random() * (wrap.clientHeight - btnF.clientHeight) + 'px';
            } else {
                btnF.style.display = 'none';
                wrap.style.display = 'none';
                document.getElementById('final-obvio').classList.remove('hidden');
                dispararConquista("ganhou um beijo meu amor!! 💋");
                iniciarExplosaoVitoria();
            }
        }

        btnF.addEventListener('click', fugir);
        btnF.addEventListener('touchstart', (e) => { e.preventDefault(); fugir(); });
        function iniciarAudioAoClicar() { if (audio.paused) audio.play().catch(() => {}); }

        window.onload = () => {
            setInterval(() => {
                const div = document.createElement('div');
                div.className = 'floating';
                div.innerText = ['💜', '💙'][Math.floor(Math.random() * 2)];
                div.style.left = (Math.random() * 90) + 'vw';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3000);
            }, 400);
            setTimeout(() => dispararConquista("eu namoro a menina mais linda do mundo!!!❤️"), 1000);
        };
    </script>
</body>
</html>
