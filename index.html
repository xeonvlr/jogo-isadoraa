<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PARA MINHA NAMORADA ISADORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-purple: #9d50bb;
            --p-blue: #6e7ff3;
            --p-cyan: #00f2fe;
            --p-pink: #ff007f;
            --p-dark: #0a081a;
            --p-border: #ffffff;
            --p-yellow: #ffeb3b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Press Start 2P', cursive;
            background: var(--p-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #0a081a 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: white;
            cursor: url('https://cur.cursors-4u.net/symbols/sym-9/sym847.cur'), auto;
        }

        body::after {
            content: " "; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            z-index: 100; background-size: 100% 4px; pointer-events: none; opacity: 0.15;
        }

        #jogo-container {
            background: rgba(15, 10, 30, 0.95);
            border: 4px solid var(--p-border);
            padding: 25px 15px; width: 90%; max-width: 360px;
            text-align: center; position: relative;
            box-shadow: 0 0 40px rgba(110, 127, 243, 0.4); z-index: 10;
        }

        /* --- SISTEMA DE CONQUISTAS --- */
        #conquista-wrapper {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: 94vw; max-width: 340px; display: flex; flex-direction: column;
            gap: 10px; z-index: 9999; pointer-events: none;
        }

        .notificacao-conquista {
            background: rgba(20, 15, 40, 0.98); border: 3px solid #fff; outline: 3px solid #000;
            padding: 8px; display: flex; align-items: center; opacity: 0;
            transform: translateY(-50px); transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            align-self: center;
        }

        .notificacao-conquista.visible { opacity: 1; transform: translateY(0); }
        .moldura-icone { width: 36px; height: 36px; border: 2px solid var(--p-purple); margin-right: 10px; display: flex; align-items: center; justify-content: center; }
        .icone-estrela { width: 24px; height: 24px; image-rendering: pixelated; filter: drop-shadow(0 0 4px var(--p-purple)) drop-shadow(0 0 1px #fff); }
        .ach-header { font-size: 6px; color: var(--p-yellow); margin-bottom: 3px; }
        .ach-title { font-size: 7px; color: #fff; line-height: 1.2; }

        /* --- NOVA ANIMAÇÃO: EXPLOSÃO DO BEIJO (BAIXO PARA CIMA) --- */
        @keyframes explosaoVitoria {
            0% { transform: translate(0, 0) scale(0.1); opacity: 0; }
            15% { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--rot)); opacity: 0; }
        }

        .particula-vitoria {
            position: fixed; bottom: 0; left: 50%; /* Nasce concentrado no centro inferior */
            z-index: 9998; pointer-events: none;
            animation: explosaoVitoria 3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        /* --- ELEMENTOS VISUAIS --- */
        .foto-pixel {
            width: 180px; height: auto; border: 4px solid var(--p-blue);
            padding: 5px; image-rendering: pixelated;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px var(--p-blue)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 15px var(--p-blue)); }
        }

        h1 { font-size: 10px; line-height: 1.6; margin-bottom: 25px; text-shadow: 2px 2px var(--p-blue); }
        .btn-container { display: flex; flex-direction: column; gap: 12px; }

        button {
            padding: 18px 10px; font-family: 'Press Start 2P', cursive; font-size: 8px;
            border: 4px solid #000; cursor: pointer; background: var(--p-blue); color: white;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.4); position: relative;
        }

        button:active { transform: translate(2px, 2px); box-shadow: inset 2px 2px 0px rgba(0,0,0,0.4); }
        .purple-btn { background: var(--p-purple); }
        .pink-btn { background: var(--p-pink); }
        .hidden { display: none !important; }

        .floating {
            position: absolute; pointer-events: none; z-index: 1;
            animation: floatUp 3s linear forwards; font-size: 24px;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-20vh); opacity: 0; }
        }

        #contador {
            font-size: 9px; background: rgba(0, 0, 0, 0.85); padding: 20px 10px;
            border: 4px double var(--p-cyan); margin: 20px 0; line-height: 2.5;
        }

        .emoji-central { font-size: 50px; display: block; margin: 20px auto; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    </style>
</head>
<body onclick="iniciarAudioAoClicar()">

    <audio id="meuAudio" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="conquista-wrapper"></div>

    <div id="jogo-container">
        <div id="tela-inicial">
            <div style="margin-bottom: 20px;">
                <img src="foto.png" alt="NOSSA FOTO" class="foto-pixel">
            </div>
            <h1>VOCE ME AMA?</h1>
            <div class="btn-container">
                <button class="purple-btn" onclick="mostrarSecao('sim')">SIM <br> [ 💜 ]</button>
                <button onclick="mostrarSecao('concerteza')">CONCERTEZA <br> [ 💙 ]</button>
                <button class="pink-btn" onclick="mostrarSecao('obvio')">OBVIO ISA <br> [ ✨ ]</button>
                <button style="background: #ffaa00;" onclick="mostrarSecao('sorriso')">SORRISO <br> [ 😁 ]</button>
            </div>
        </div>

        <div id="resposta-sim" class="hidden">
            <h1>EU TAMBEM TE AMO ISADORA!</h1>
            <p style="color: var(--p-cyan); font-size: 9px;">AMOR DA MINHA VIDA!</p>
            <button style="margin-top:20px; width:100%" onclick="voltarMenu()">[ VOLTAR ]</button>
        </div>

       <div id="resposta-concerteza" class="hidden">
    <h1 style="font-size: 9px;">CONECTADAS DESDE <br><span style="color: var(--p-yellow)">05/07/2025</span></h1>
    <div id="contador">CALCULANDO...</div>
    <p style="color: var(--p-blue); font-size: 8px;">PRA SEMPRE E SEMPRE AMOR!</p>
    <button class="btn-voltar" onclick="voltarMenu()">[ VOLTAR ]</button>
</div>

        <div id="resposta-obvio" class="hidden">
            <h1>PROVE SEU AMOR!</h1>
            <div id="wrapper-fugitivo" style="height: 150px; position: relative; width: 100%;">
                <button id="btn-fugitivo" style="min-width:160px;">ME DA UM BEIJO! 💋</button>
            </div>
            <div id="final-obvio" class="hidden">
                <span class="emoji-central">🙄</span>
                <p style="color: var(--p-pink); font-size: 12px;">VOCE ME PEGOU !!!</p>
            </div>
            <button style="margin-top:20px; width:100%" onclick="voltarMenu()">[ VOLTAR ]</button>
        </div>

       <div id="resposta-sorriso" class="hidden">
    <h1>SEU SORRISO ILUMINA TUDO!</h1>
    <div class="container-foto">
        <img src="sorriso.jpeg" alt="SORRISO" class="foto-pixel" style="border-color: #ffaa00;">
    </div>
    <p style="color: #fff; font-size: 9px; line-height: 1.6;">SEU SORRISO E PERFEITO, <br> SOU APAIXONADA!</p>
    <button class="btn-voltar" onclick="voltarMenu()">[ VOLTAR ]</button>
</div>
    </div>

    <template id="template-conquista">
        <div class="notificacao-conquista">
            <div class="moldura-icone">
                <img src="estrela.png" class="icone-estrela" style="background: transparent;">
            </div>
            <div class="texto-conquista">
                <div class="ach-header">Achievement Unlocked</div>
                <div class="ach-title"></div>
            </div>
        </div>
    </template>

    <script>
        const dataInicio = new Date(2025, 6, 5); 
        const audio = document.getElementById('meuAudio');
        let intervaloContador, cliquesFugitivo = 0;

        function dispararConquista(texto) {
            const wrapper = document.getElementById('conquista-wrapper');
            const template = document.getElementById('template-conquista').content;
            const clone = template.cloneNode(true).firstElementChild;
            clone.querySelector('.ach-title').innerText = texto;
            wrapper.appendChild(clone);
            setTimeout(() => clone.classList.add('visible'), 100);
            setTimeout(() => {
                clone.classList.remove('visible');
                setTimeout(() => clone.remove(), 600);
            }, 5000);
        }

        // --- CORREÇÃO: FUNÇÃO DE EXPLOSÃO DO BEIJO (DE BAIXO PARA CIMA) ---
        function iniciarExplosaoVitoria() {
            const wrapJogo = document.getElementById('jogo-container');
            
            for (let i = 0; i < 70; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'particula-vitoria';
                    const tipo = Math.random();
                    
                    if (tipo > 0.6) {
                        el.innerHTML = `<img src="estrela.png" style="width:26px; height:26px; image-rendering: pixelated; filter: drop-shadow(0 0 5px var(--p-purple));">`;
                    } else {
                        el.innerText = tipo > 0.3 ? '💜' : '💙';
                        el.style.fontSize = '24px';
                        el.style.filter = `drop-shadow(0 0 5px ${tipo > 0.3 ? 'var(--p-purple)' : 'var(--p-cyan)'})`;
                    }
                    
                    // Define a trajetória de explosão para cima
                    const angle = (Math.random() * Math.PI) - Math.PI; // Ângulo para cima (-180 a 0 graus)
                    const radius = Math.random() * 150 + 100; // Distância da explosão (v (px))
                    
                    // Variáveis CSS para o Keyframe
                    const angleDeg = (Math.random() * 120 - 60); // Ângulo para cima (-60 a 60 graus)
                    const velocity = Math.random() * 200 + 150; // Velocidade (px)
                    
                    el.style.setProperty('--dx', `${Math.sin(angleDeg * Math.PI / 180) * velocity}px`);
                    el.style.setProperty('--dy', `-${Math.cos(angleDeg * Math.PI / 180) * velocity + 500}px`); // Voa para cima
                    el.style.setProperty('--rot', `${Math.random() * 720 - 360}deg`);
                    
                    el.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
                    
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 3500);
                }, i * 20); // Cria um fluxo rápido
            }
        }

        function iniciarAudioAoClicar() {
            if (audio.paused) audio.play().catch(() => {});
        }

        // Efeito de fundo contínuo (Você disse que está certo)
        function initEffect() {
            setInterval(() => {
                const div = document.createElement('div');
                div.className = 'floating';
                div.innerText = ['💜', '💙'][Math.floor(Math.random() * 2)];
                div.style.left = (Math.random() * 90) + 'vw';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3000);
            }, 300);
        }

        function mostrarSecao(tipo) {
            iniciarAudioAoClicar();
            document.querySelectorAll('#jogo-container > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('resposta-' + tipo).classList.remove('hidden');
            if(tipo === 'concerteza') {
                atualizarContador();
                intervaloContador = setInterval(atualizarContador, 1000);
            }
            if(tipo === 'obvio') resetarBotaoFugitivo();
        }

        function voltarMenu() {
            document.querySelectorAll('#jogo-container > div').forEach(div => div.classList.add('hidden'));
            document.getElementById('tela-inicial').classList.remove('hidden');
            clearInterval(intervaloContador);
        }

        function atualizarContador() {
            const diff = new Date() - dataInicio;
            const d = Math.floor(diff / 86400000), h = Math.floor((diff / 3600000) % 24), m = Math.floor((diff / 60000) % 60), s = Math.floor((diff / 1000) % 60);
            document.getElementById('contador').innerHTML = `DIAS: ${d}<br>HORAS: ${h}<br>MINS: ${m}<br>SECS: ${s}`;
        }

        const btnF = document.getElementById('btn-fugitivo');
        function resetarBotaoFugitivo() {
            cliquesFugitivo = 0;
            btnF.style.display = 'block'; btnF.style.position = 'relative';
            btnF.style.left = '0'; btnF.style.top = '0';
            btnF.innerText = "ME DA UM BEIJO! 💋";
            document.getElementById('final-obvio').classList.add('hidden');
            document.getElementById('wrapper-fugitivo').style.display = 'block';
        }

        function fugir(e) {
            if (e.type === 'touchstart') e.preventDefault();
            cliquesFugitivo++;
            const wrap = document.getElementById('wrapper-fugitivo');
            if(cliquesFugitivo < 6) {
                btnF.style.position = 'absolute';
                btnF.style.left = Math.random() * (wrap.clientWidth - btnF.clientWidth) + 'px';
                btnF.style.top = Math.random() * (wrap.clientHeight - btnF.clientHeight) + 'px';
                if(cliquesFugitivo === 3) btnF.innerText = "MAIS RAPIDO! ✨";
            } else {
                // --- VITÓRIA ---
                btnF.style.display = 'none';
                wrap.style.display = 'none';
                document.getElementById('final-obvio').classList.remove('hidden');
                
                dispararConquista("ganhou um beijo meu amor!! 💋");
                
                // === NOVO: DISPARA A EXPLOSÃO DE VITÓRIA (CORRIGIDO) ===
                iniciarExplosaoVitoria();
            }
        }

        btnF.addEventListener('click', fugir);
        btnF.addEventListener('touchstart', fugir);

        window.onload = () => {
            initEffect();
            setTimeout(() => dispararConquista("eu namoro a menina mais linda do mundo!!!❤️"), 1500);
        };
    </script>
</body>
</html>
